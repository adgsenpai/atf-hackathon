name: civicwatch

# Full CivicWatch Africa stack:
#   db          PostgreSQL 16 + PostGIS   (host :5433)
#   api         Node/Express civic API    (internal :4000, via web at /api)
#   iec-api     Rust/axum IEC party API   (host :8081, via web at /iec)
#   web         React SPA + nginx proxy   (host :8088)
#   iec-scrape  one-off re-scrape:  docker compose run --rm iec-scrape

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civicwatch}
      POSTGRES_USER: ${POSTGRES_USER:-civicwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicwatch}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-civicwatch}:${POSTGRES_PASSWORD:-civicwatch}@db:5432/${POSTGRES_DB:-civicwatch}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 4000
      IEC_API_URL: ${IEC_API_URL:-http://iec-api:8080}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      iec-api:
        condition: service_started

  iec-api:
    build: ./iec-api
    image: iec-api:latest
    restart: unless-stopped
    ports:
      - "${IEC_PORT:-8081}:8080"
    environment:
      RUST_LOG: info
      # Set to enable POST /api/refresh (re-scrape). Leave empty to disable.
      REFRESH_TOKEN: ${REFRESH_TOKEN:-}
    volumes:
      # parties.json + logos/ ; re-scrapes write back here.
      - ./iec-api/data:/app/data

  # One-off re-scrape: docker compose run --rm iec-scrape
  iec-scrape:
    image: iec-api:latest
    profiles: ["scrape"]
    command: ["scrape"]
    volumes:
      - ./iec-api/data:/app/data

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
      iec-api:
        condition: service_healthy

volumes:
  db-data:
  uploads:
