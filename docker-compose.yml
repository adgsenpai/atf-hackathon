name: civicwatch

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civicwatch}
      POSTGRES_USER: ${POSTGRES_USER:-civicwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicwatch}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-civicwatch}:${POSTGRES_PASSWORD:-civicwatch}@db:5432/${POSTGRES_DB:-civicwatch}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 4000
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  uploads:
